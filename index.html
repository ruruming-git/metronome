<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>節拍器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');

  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #f0ead8;
    --wood-dark: #2c1a0e;
  }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    font-family: 'Crimson Pro', serif;
    -webkit-text-size-adjust: 100%;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    height: 100dvh;
  }

  /* ── Top bar ── */
  .top-bar {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 22px 0;
    flex-shrink: 0;
  }

  .bpm-readout {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .bpm-number {
    font-family: 'Playfair Display', serif;
    font-size: 46px;
    color: var(--cream);
    line-height: 1;
  }

  .bpm-unit {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: #1c1c1c;
    text-transform: uppercase;
  }

  .tempo-name {
    font-style: italic;
    font-size: 14px;
    color: #242010;
  }

  /* ── Metronome fills remaining space ── */
  .metronome-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 0;
  }

  .body-wrap {
    position: relative;
    width: min(52vw, 240px);
    aspect-ratio: 200 / 280;
    filter: drop-shadow(0 14px 32px rgba(0,0,0,0.9));
  }

  .body-svg {
    position: absolute;
    inset: 0; width: 100%; height: 100%;
  }

  /* ── Pendulum ── */
  .pendulum-arm {
    position: absolute;
    left: 50%;
    top: calc(100% * 58 / 280);
    transform-origin: bottom center;
    transform: translateX(-50%);
    width: calc(100% * 5 / 200);
    height: calc(100% * 190 / 280);
    background: linear-gradient(0deg, #777 0%, #ccc 55%, #bbb 100%);
    border-radius: 2px 2px 1px 1px;
    cursor: grab;
    touch-action: none;
  }

  .pendulum-pivot {
    position: absolute;
    left: 50%; bottom: -5%;
    transform: translateX(-50%);
    width: 280%; aspect-ratio: 1;
    background: radial-gradient(circle at 35% 35%, #eee, #888);
    border-radius: 50%;
    border: 1px solid #555;
  }

  .pendulum-weight {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 40%;
    width: 700%; height: calc(100% * 18 / 190);
    background: linear-gradient(135deg, #e8c97a 0%, #c9a84c 50%, #a07830 100%);
    border-radius: 3px;
    border: 1px solid #8a6020;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    cursor: ns-resize;
    z-index: 10;
    transition: bottom 0.3s ease;
    touch-action: none;
    -webkit-touch-callout: none;
  }

  .pendulum-weight::after {
    content: '';
    position: absolute;
    left: 8%; right: 8%; top: 50%;
    height: 2px; margin-top: -1px;
    background: rgba(0,0,0,0.3);
    border-radius: 1px;
  }

  .pendulum-tip {
    position: absolute;
    left: 50%; top: -3.5%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 300% solid transparent;
    border-right: 300% solid transparent;
    border-bottom: calc(100% * 10 / 190) solid #ccc;
  }

  /* Rotation driven by JS - no CSS animation */
  .pendulum-arm.swinging { cursor: grabbing; }



  /* ── Hint ── */
  .hint {
    flex-shrink: 0;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #000;
    padding: 2px 0 4px;
    transition: color 0.5s;
    text-align: center;
  }
  .hint.visible { color: #252010; }

  /* ── Bottom controls ── */
  .controls {
    flex-shrink: 0;
    width: 100%;
    max-width: 420px;
    padding: 0 20px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .bpm-slider-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bpm-slider-wrap span {
    font-size: 10px;
    color: #141408;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }

  input[type=range] {
    flex: 1;
    -webkit-appearance: none; appearance: none;
    height: 3px;
    background: linear-gradient(90deg, var(--gold) var(--pct,24%), #111 0%);
    border-radius: 2px;
    outline: none;
    touch-action: manipulation;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold));
    border: 2px solid #000;
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    margin-top: -10px;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .time-sig-row { display: flex; gap: 4px; }

  .time-sig-btn {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    width: 38px; height: 38px;
    border: 1px solid #141408;
    background: transparent;
    color: #1e1a08;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }
  .time-sig-btn.selected {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.07);
  }

  .beat-lights {
    display: flex; gap: 5px; align-items: center;
    flex: 1; justify-content: center;
  }
  .beat-light {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #0d0d0d;
    border: 1px solid #141408;
    transition: background 0.05s, box-shadow 0.05s;
  }
  .beat-light.on { background: var(--gold-light); box-shadow: 0 0 6px var(--gold); }
  .beat-light.accent { width: 8px; height: 8px; }

  .tap-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 12px;
    letter-spacing: 0.12em;
    width: 48px; height: 38px;
    border: 1px solid #1c1c0c;
    background: transparent;
    color: #1c1c0c;
    cursor: pointer;
    border-radius: 2px;
    touch-action: manipulation;
  }

  /* ── Sound drawer ── */
  .sound-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    cursor: pointer;
    touch-action: manipulation;
    border-top: 1px solid #0e0e0e;
  }

  .sound-toggle-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sound-label {
    font-size: 9px;
    letter-spacing: 0.28em;
    color: #141408;
    text-transform: uppercase;
  }

  .sound-current {
    font-size: 13px;
    color: var(--gold);
    font-style: italic;
  }

  .sound-chevron {
    font-size: 9px;
    color: #1c1c0c;
    transition: transform 0.22s;
    display: inline-block;
  }
  .sound-chevron.open { transform: rotate(180deg); }

  .sound-drawer {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease, opacity 0.22s;
    opacity: 0;
  }
  .sound-drawer.open { max-height: 110px; opacity: 1; }

  .sound-btn {
    font-family: 'Crimson Pro', serif;
    font-size: 14px;
    height: 42px;
    border: 1px solid #141408;
    background: transparent;
    color: #181808;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    touch-action: manipulation;
  }
  .sound-btn.selected {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.06);
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="bpm-readout">
    <div class="bpm-number" id="bpmNum">80</div>
    <div class="bpm-unit">BPM</div>
  </div>
  <div class="tempo-name" id="tempoName">Andante</div>
</div>

<div class="metronome-wrap">
  <div class="body-wrap">
    <svg class="body-svg" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#3a1f0a"/>
          <stop offset="18%"  stop-color="#6b4020"/>
          <stop offset="42%"  stop-color="#8b5e3c"/>
          <stop offset="62%"  stop-color="#7a4e2c"/>
          <stop offset="82%"  stop-color="#5c3a1e"/>
          <stop offset="100%" stop-color="#3a1f0a"/>
        </linearGradient>
        <linearGradient id="woodTop" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#2c1a0e"/>
          <stop offset="50%"  stop-color="#a07848"/>
          <stop offset="100%" stop-color="#2c1a0e"/>
        </linearGradient>
        <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#c4935a" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#2c1a0e" stop-opacity="0.25"/>
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%"   stop-color="#e8c97a"/>
          <stop offset="50%"  stop-color="#c9a84c"/>
          <stop offset="100%" stop-color="#a07830"/>
        </linearGradient>
        <clipPath id="bodyClip">
          <polygon points="60,10 140,10 180,265 20,265"/>
        </clipPath>
      </defs>

      <ellipse cx="100" cy="273" rx="78" ry="7" fill="rgba(0,0,0,0.32)"/>
      <polygon points="60,10 140,10 180,265 20,265" fill="url(#woodGrad)"/>
      <polygon points="60,10 140,10 180,265 20,265" fill="url(#faceGrad)"/>
      <line x1="60" y1="10" x2="20" y2="265" stroke="rgba(200,150,80,0.18)" stroke-width="1.5"/>
      <line x1="140" y1="10" x2="180" y2="265" stroke="rgba(0,0,0,0.32)" stroke-width="1.5"/>
      <rect x="55" y="6"   width="90" height="10" rx="3" fill="url(#woodTop)"/>
      <rect x="55" y="6"   width="90" height="3"  rx="1.5" fill="rgba(255,255,255,0.09)"/>
      <rect x="15" y="262" width="170" height="14" rx="3" fill="url(#woodTop)"/>
      <rect x="15" y="262" width="170" height="4"  rx="2" fill="rgba(255,255,255,0.06)"/>
      <polygon points="62,14 138,14 140,20 60,20"   fill="url(#goldGrad)" opacity="0.75"/>
      <polygon points="22,258 178,258 176,264 24,264" fill="url(#goldGrad)" opacity="0.5"/>

      <g clip-path="url(#bodyClip)" opacity="0.48">
        <g stroke="#c9a84c" stroke-width="0.8">
          <line x1="72" y1="42"  x2="86" y2="42"/>
          <line x1="70" y1="58"  x2="82" y2="58"/>
          <line x1="68" y1="78"  x2="84" y2="78"/>
          <line x1="66" y1="100" x2="86" y2="100"/>
          <line x1="64" y1="122" x2="84" y2="122"/>
          <line x1="62" y1="148" x2="84" y2="148"/>
          <line x1="60" y1="174" x2="82" y2="174"/>
          <line x1="58" y1="202" x2="80" y2="202"/>
          <line x1="56" y1="230" x2="78" y2="230"/>
        </g>
        <g fill="#c9a84c" font-size="6" font-family="Georgia,serif" text-anchor="middle">
          <text x="98" y="44">208</text><text x="97" y="60">184</text>
          <text x="96" y="80">160</text><text x="95" y="102">138</text>
          <text x="93" y="124">116</text><text x="91" y="150">96</text>
          <text x="89" y="176">76</text><text x="87" y="204">56</text>
          <text x="85" y="232">40</text>
        </g>
      </g>

      <rect x="65" y="24" width="70" height="230" rx="4" fill="rgba(7,3,1,0.9)" stroke="rgba(201,168,76,0.32)" stroke-width="1"/>
      <rect x="63" y="22" width="74" height="234" rx="5" fill="none" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="100" cy="243" r="6" fill="url(#goldGrad)" opacity="0.88"/>
      <circle cx="100" cy="243" r="3" fill="#2c1a0e"/>
      <line x1="100" y1="28" x2="100" y2="237" stroke="rgba(201,168,76,0.09)" stroke-width="1" stroke-dasharray="3,5"/>
      <path d="M75,36 Q100,27 125,36" stroke="rgba(201,168,76,0.25)" stroke-width="1" fill="none"/>
      <line x1="75"  y1="36" x2="69"  y2="31" stroke="rgba(201,168,76,0.42)" stroke-width="1"/>
      <line x1="125" y1="36" x2="131" y2="31" stroke="rgba(201,168,76,0.42)" stroke-width="1"/>
      <ellipse cx="100" cy="248" rx="21" ry="5" fill="url(#goldGrad)" opacity="0.4"/>
    </svg>

    <div class="pendulum-arm" id="pendulumArm">
      <div class="pendulum-pivot"></div>
      <div class="pendulum-weight" id="weightBob"></div>
      <div class="pendulum-tip"></div>
    </div>
  </div>
</div>

<div class="hint" id="hint">拉動指針開始 &nbsp;·&nbsp; 放開暫停</div>

<div class="controls">
  <div class="bpm-slider-wrap">
    <span>40</span>
    <input type="range" id="bpmSlider" min="40" max="208" value="80" step="1">
    <span>208</span>
  </div>

  <div class="bottom-row">
    <div class="time-sig-row">
      <button class="time-sig-btn selected" data-beats="4">4/4</button>
      <button class="time-sig-btn" data-beats="3">3/4</button>
      <button class="time-sig-btn" data-beats="2">2/4</button>
      <button class="time-sig-btn" data-beats="6">6/8</button>
    </div>
    <div class="beat-lights" id="beatLights"></div>
    <button class="tap-btn" id="tapBtn">TAP</button>
  </div>

  <div class="sound-toggle" id="soundToggle">
    <div class="sound-toggle-left">
      <span class="sound-label">音色</span>
      <span class="sound-current" id="soundCurrent">木頭</span>
    </div>
    <span class="sound-chevron" id="soundChevron">▲</span>
  </div>

  <div class="sound-drawer" id="soundDrawer">
    <button class="sound-btn selected" data-sound="wood"  data-label="木頭">木頭</button>
    <button class="sound-btn"          data-sound="click" data-label="清脆">清脆</button>
    <button class="sound-btn"          data-sound="bell"  data-label="鐘聲">鐘聲</button>
    <button class="sound-btn"          data-sound="rim"   data-label="鼓邊">鼓邊</button>
    <button class="sound-btn"          data-sound="beep"  data-label="電子">電子</button>
    <button class="sound-btn"          data-sound="deep"  data-label="低沉">低沉</button>
  </div>
</div>

<script>
// ── State ──
let bpm = 80, beatsPerBar = 4, running = false, beatIndex = 0;
let rafId = null, tapTimes = [];
let lastPhase = -1, animStartTime = 0;
let currentSound = 'wood';

const pendulumArm = document.getElementById('pendulumArm');
const weightBob   = document.getElementById('weightBob');
const bpmNum      = document.getElementById('bpmNum');
const tempoName   = document.getElementById('tempoName');
const bpmSlider   = document.getElementById('bpmSlider');
const tapBtn      = document.getElementById('tapBtn');
const hintEl      = document.getElementById('hint');

// ── Tempo names ──
const tempos = [
  {max:45,name:'Grave'},{max:52,name:'Largo'},{max:60,name:'Larghetto'},
  {max:66,name:'Adagio'},{max:76,name:'Adagietto'},{max:80,name:'Andante'},
  {max:96,name:'Andantino'},{max:108,name:'Moderato'},{max:120,name:'Allegretto'},
  {max:144,name:'Allegro'},{max:168,name:'Vivace'},{max:192,name:'Presto'},
  {max:999,name:'Prestissimo'},
];
const getTempoName = b => tempos.find(t => b <= t.max)?.name || 'Prestissimo';

// ── Beat lights ──
function buildBeatLights() {
  const c = document.getElementById('beatLights');
  c.innerHTML = '';
  for (let i = 0; i < beatsPerBar; i++) {
    const d = document.createElement('div');
    d.className = 'beat-light' + (i === 0 ? ' accent' : '');
    c.appendChild(d);
  }
}
function flashBeat(idx) {
  document.querySelectorAll('.beat-light').forEach((l,i) => l.classList.toggle('on', i===idx));
}

// ── Weight position ──
function updateWeightPosition(b) {
  // bottom %: fast BPM=208→10%, slow BPM=40→78%
  const pct = 10 + (b - 40) / (208 - 40) * 68;
  weightBob.style.bottom = pct + '%';
}

// ── Slider fill ──
function updateSliderFill(v) {
  bpmSlider.style.setProperty('--pct', ((v-40)/(208-40)*100)+'%');
}

// ── Set BPM ──
function setBPM(val) {
  bpm = Math.max(40, Math.min(208, val));
  bpmNum.textContent = bpm;
  tempoName.textContent = getTempoName(bpm);
  bpmSlider.value = bpm;
  updateSliderFill(bpm);
  updateWeightPosition(bpm);
  if (running) restartTick();
}

// ── Audio ──
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
document.addEventListener('touchstart', () => getAudioCtx(), {once:true});

function noise(ctx, dur) {
  const b = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  const s = ctx.createBufferSource(); s.buffer = b; return s;
}

function playClick(accent) {
  try {
    const ctx = getAudioCtx(), t = ctx.currentTime;
    ({
      wood:()=>{
        const s=noise(ctx,0.08),f=ctx.createBiquadFilter(),g=ctx.createGain();
        f.type='bandpass';f.frequency.value=accent?1100:820;f.Q.value=2.5;
        s.connect(f);f.connect(g);g.connect(ctx.destination);
        const d=ctx.sampleRate*0.08;
        const sd=s.buffer.getChannelData(0);
        for(let i=0;i<sd.length;i++) sd[i]*=Math.exp(-i/(ctx.sampleRate*0.01));
        g.gain.setValueAtTime(accent?1.1:0.75,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
        s.start(t);s.stop(t+0.08);
      },
      click:()=>{
        const s=noise(ctx,0.04),f=ctx.createBiquadFilter(),g=ctx.createGain();
        f.type='highpass';f.frequency.value=accent?3800:2600;
        s.connect(f);f.connect(g);g.connect(ctx.destination);
        const sd=s.buffer.getChannelData(0);
        for(let i=0;i<sd.length;i++) sd[i]*=Math.exp(-i/(ctx.sampleRate*0.003));
        g.gain.setValueAtTime(accent?0.9:0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
        s.start(t);s.stop(t+0.04);
      },
      bell:()=>{
        [accent?880:660,accent?1760:1320,accent?2640:1980,accent?3520:2640].forEach((f,i)=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          const dec=accent?0.65:0.42;
          o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime((accent?0.34:0.2)/(i+1),t);
          g.gain.exponentialRampToValueAtTime(0.001,t+dec);
          o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dec);
        });
      },
      rim:()=>{
        const s=noise(ctx,0.06),f=ctx.createBiquadFilter(),g=ctx.createGain();
        f.type='peaking';f.frequency.value=accent?380:280;f.gain.value=14;f.Q.value=3;
        const sd=s.buffer.getChannelData(0);
        for(let i=0;i<sd.length;i++) sd[i]*=Math.exp(-i/(ctx.sampleRate*0.008));
        s.connect(f);f.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(accent?1.3:0.85,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
        s.start(t);s.stop(t+0.06);
        const o=ctx.createOscillator(),og=ctx.createGain();
        o.frequency.value=accent?210:170;og.gain.setValueAtTime(accent?0.28:0.18,t);
        og.gain.exponentialRampToValueAtTime(0.001,t+0.04);
        o.connect(og);og.connect(ctx.destination);o.start(t);o.stop(t+0.04);
      },
      beep:()=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.type='square';o.frequency.value=accent?1047:784;
        g.gain.setValueAtTime(accent?0.16:0.1,t);
        g.gain.exponentialRampToValueAtTime(0.001,t+(accent?0.11:0.07));
        o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+0.12);
      },
      deep:()=>{
        const s=noise(ctx,0.12),f=ctx.createBiquadFilter(),g=ctx.createGain();
        f.type='lowpass';f.frequency.value=accent?300:200;
        const sd=s.buffer.getChannelData(0);
        for(let i=0;i<sd.length;i++) sd[i]*=Math.exp(-i/(ctx.sampleRate*0.025));
        s.connect(f);f.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(accent?1.9:1.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
        s.start(t);s.stop(t+0.12);
        const o=ctx.createOscillator(),og=ctx.createGain();
        o.frequency.setValueAtTime(accent?110:75,t);o.frequency.exponentialRampToValueAtTime(38,t+0.09);
        og.gain.setValueAtTime(accent?0.48:0.28,t);og.gain.exponentialRampToValueAtTime(0.001,t+0.11);
        o.connect(og);og.connect(ctx.destination);o.start(t);o.stop(t+0.11);
      },
    }[currentSound]||window._noop)();
  } catch(e){}
}
window._noop = ()=>{};

// ── Unified animation + sound loop ──
// We drive rotation ourselves with easeInOut so sound fires exactly
// when the needle reaches the extreme (angle = ±MAX_DEG).
const MAX_DEG = 22;

// easeInOut: maps linear t∈[0,1] → smooth t
function easeInOut(t) {
  return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
}

function animLoop(now) {
  if (!running) return;

  const fullPeriod = (60 / bpm) * 2000; // ms for one full left→right→left cycle
  const elapsed    = (now - animStartTime) % fullPeriod;
  const t          = elapsed / fullPeriod; // 0..1 linear over full period

  // t: 0→0.5 = left extreme → right extreme, 0.5→1 = right → left
  let angle;
  if (t < 0.5) {
    // left (-MAX) to right (+MAX)
    angle = -MAX_DEG + easeInOut(t * 2) * 2 * MAX_DEG;
  } else {
    // right (+MAX) to left (-MAX)
    angle = MAX_DEG - easeInOut((t - 0.5) * 2) * 2 * MAX_DEG;
  }

  pendulumArm.style.transform = `translateX(-50%) rotate(${angle}deg)`;

  // Fire sound when crossing ±MAX_DEG (i.e. at the very tip of the swing)
  // Detect by sign change of (MAX_DEG - |angle|) being near zero
  const atExtreme = Math.abs(Math.abs(angle) - MAX_DEG) < 0.8; // within 0.8°
  const side = angle < 0 ? 0 : 1; // 0=left, 1=right
  const extremeKey = atExtreme ? side : -1;

  if (atExtreme && extremeKey !== lastPhase) {
    lastPhase = extremeKey;
    fireTick();
  }

  rafId = requestAnimationFrame(animLoop);
}

function fireTick() {
  const isAccent = beatIndex % beatsPerBar === 0;
  playClick(isAccent);
  flashBeat(beatIndex % beatsPerBar);
  beatIndex++;
}

function restartTick() {
  cancelAnimationFrame(rafId); rafId = null;
  beatIndex = 0; lastPhase = -1;
  if (!running) return;
  animStartTime = performance.now();
  rafId = requestAnimationFrame(animLoop);
}

// ── Wake Lock ──
let wakeLock = null;
async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && running) acquireWakeLock();
});

// ── Start / Stop ──
function start() {
  if (running) return;
  running = true; beatIndex = 0; lastPhase = -1;
  pendulumArm.classList.add('swinging');
  acquireWakeLock();
  animStartTime = performance.now();
  rafId = requestAnimationFrame(animLoop);
  hintEl.classList.remove('visible');
}

function stop() {
  if (!running) return;
  running = false;
  cancelAnimationFrame(rafId); rafId = null;
  pendulumArm.classList.remove('swinging');
  pendulumArm.style.transform = 'translateX(-50%) rotate(0deg)';
  document.querySelectorAll('.beat-light').forEach(l => l.classList.remove('on'));
  releaseWakeLock();
}

// ── Pendulum arm drag → start on drag, stop on release ──
let armDown = false, armMoved = false, armStartX = 0, armStartY = 0;

function getXY(e) {
  return e.touches
    ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
    : { x: e.clientX,            y: e.clientY };
}

pendulumArm.addEventListener('mousedown',  onArmDown);
pendulumArm.addEventListener('touchstart', onArmDown, {passive:false});

function onArmDown(e) {
  // Don't intercept weight-bob touches
  if (e.target === weightBob) return;
  e.preventDefault(); e.stopPropagation();
  const p = getXY(e);
  armDown = true; armMoved = false;
  armStartX = p.x; armStartY = p.y;
}

document.addEventListener('mousemove',  onArmMove);
document.addEventListener('touchmove',  onArmMove, {passive:false});

function onArmMove(e) {
  if (!armDown) return;
  e.preventDefault();
  const p = getXY(e);
  const dx = p.x - armStartX, dy = p.y - armStartY;
  if (!armMoved && Math.sqrt(dx*dx+dy*dy) > 10) {
    armMoved = true;
    start();
  }
}

document.addEventListener('mouseup',     onArmUp);
document.addEventListener('touchend',    onArmUp);
document.addEventListener('touchcancel', onArmUp);

function onArmUp(e) {
  if (!armDown) return;
  armDown = false;
  if (armMoved) {
    stop();           // drag → release = stop
  } else {
    // tap on arm = toggle
    running ? stop() : start();
  }
}

// ── Weight drag → BPM ──
let wDown = false, wStartY = 0, wStartBPM = 80;

weightBob.addEventListener('mousedown',  onWDown);
weightBob.addEventListener('touchstart', onWDown, {passive:false});

function onWDown(e) {
  e.preventDefault(); e.stopPropagation();
  wDown = true; wStartY = getXY(e).y; wStartBPM = bpm;
  weightBob.style.transition = 'none';
  // Also prevent arm-drag from triggering
  armDown = false;
}

document.addEventListener('mousemove',  onWMove);
document.addEventListener('touchmove',  onWMove, {passive:false});

function onWMove(e) {
  if (!wDown) return;
  e.preventDefault();
  const dy = getXY(e).y - wStartY;
  setBPM(wStartBPM + Math.round(-dy * 1.2));
}

document.addEventListener('mouseup',     onWUp);
document.addEventListener('touchend',    onWUp);
document.addEventListener('touchcancel', onWUp);

function onWUp() {
  if (!wDown) return;
  wDown = false;
  weightBob.style.transition = 'bottom 0.3s ease';
}

// ── Slider ──
bpmSlider.addEventListener('input', () => setBPM(+bpmSlider.value));

// ── Time signature ──
document.querySelectorAll('.time-sig-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.time-sig-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    beatsPerBar = +btn.dataset.beats;
    beatIndex = 0;
    buildBeatLights();
  });
});

// ── Tap tempo ──
tapBtn.addEventListener('click', () => {
  const now = Date.now();
  tapTimes.push(now);
  if (tapTimes.length > 6) tapTimes.shift();
  if (tapTimes.length >= 2) {
    const diffs = tapTimes.slice(1).map((t,i) => t - tapTimes[i]);
    setBPM(Math.round(60000 / (diffs.reduce((a,b)=>a+b)/diffs.length)));
  }
  clearTimeout(tapTimes._t);
  tapTimes._t = setTimeout(() => { tapTimes = []; }, 2000);
});

// ── Sound drawer ──
const soundToggle  = document.getElementById('soundToggle');
const soundDrawer  = document.getElementById('soundDrawer');
const soundChevron = document.getElementById('soundChevron');
const soundCurrent = document.getElementById('soundCurrent');

soundToggle.addEventListener('click', () => {
  const o = soundDrawer.classList.toggle('open');
  soundChevron.classList.toggle('open', o);
});

document.querySelectorAll('.sound-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    currentSound = btn.dataset.sound;
    soundCurrent.textContent = btn.dataset.label;
    soundDrawer.classList.remove('open');
    soundChevron.classList.remove('open');
    playClick(false);
  });
});

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.code === 'Space')     { e.preventDefault(); running ? stop() : start(); }
  if (e.code === 'ArrowUp')   setBPM(bpm+1);
  if (e.code === 'ArrowDown') setBPM(bpm-1);
  if (e.code === 'KeyT')      tapBtn.click();
});

// ── Init ──
buildBeatLights();
setBPM(80);
hintEl.classList.add('visible');
setTimeout(() => hintEl.classList.remove('visible'), 3500);
</script>
</body>
</html>
